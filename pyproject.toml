[project]
name = "neuronos"
version = "0.1.0"
description = "Local-first AI desktop assistant MVP backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "yt-dlp>=2025.1.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
memory = [
  "chromadb>=0.5.0",
]
voice = [
  "faster-whisper>=1.0.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
